name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No package-lock.json is committed (it must be generated with registry
      # access), so we use `npm install` rather than `npm ci`. To switch to the
      # stricter, reproducible `npm ci`, run `npm install` locally once, commit
      # the generated package-lock.json, then re-add `cache: npm` above and
      # change this to `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Build needs no real secrets (DB/AI pages are dynamic). Placeholders
          # keep any env reads happy without exposing anything.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
